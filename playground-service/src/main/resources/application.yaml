spring:
  application:
    name: playground-service

rate-limit:
  enabled: true
  capacity: 20          # requests allowed per window, per client
  refill-period: 1m     # window over which tokens are replenished
  idle-expiry: 10m      # a client's bucket is evicted after this much inactivity
  max-clients: 100000   # cap on live buckets in memory (bounds by count, not only by time)
